# Vinyl-Mind configuration. Every key is optional; the values shown are the defaults. Unknown keys are an error.
# Paths and secrets come from the environment: VINYL_MIND_DATA_DIR, VINYL_MIND_DATABASE_URL, VINYL_MIND_ADMIN_TOKEN.

# database_url = "postgres://vinyl-mind:secret@db:5432/vinyl-mind"   # default: SQLite in the data directory
listen = ":8080"
join_mode = "approval"            # "approval": stations without invitation wait for `vinyl-mind approve`
                                  # "invitation": an invitation code is required
clock_skew_s = 300                # accepted difference between a request's timestamp and the server clock
station_requests_per_min = 60
address_requests_per_min = 120
joins_per_hour = 10               # per client address
joins_per_day = 20                # new stations per day in total, whatever the source (a second line behind
                                  # any account service that hands out invitations)
access_log_days = 14
max_profiles_per_station = 16
feature_versions = [1]
trusted_proxies = []              # addresses or prefixes of the reverse proxy, e.g. ["172.18.0.0/16"]

[aggregation]
method = "trimmed_mean"           # or "median"
trim = 0.2                        # share of the weight cut off at each end, per coefficient
manual_weight = 5.0               # a judgement by hand counts like five master classifications
max_est_error = 0.30              # contributions with a worse self-check are left out
max_station_share = 0.25          # cap of a fully trusted station's share; a station's cap is this times its trust
min_profiles = 3
min_stations = 2
min_class_profiles = 5            # before a chain class gets a model of its own
trust_start = 0.25
trust_min = 0.05
trust_step = 0.1                  # gained at most once per day
trust_auto_max = 0.9              # where automatic gains stop: the full level (an anchor) is the operator's to give
trust_penalty = 0.15              # lost at most once per day, for a changed contribution far from the reference
consistency_k = 3.0               # the band around the anchors' reference is this many robust spreads wide
consistency_floor = 0.25          # the least spread the band is built from, in coefficient units
max_evidence = 5000.0             # weighted examples one profile can claim at most (a station: twice that)
newcomer_trust = 1.0              # stations below this trust are not anchors; by default everything that the
                                  # operator did not set to 1 (`vinyl-mind trust`)
newcomer_share = 0.2              # all stations that are not anchors share this part of the mean in equal parts

[publication]
auto = true                       # publish and withdraw by the stations' check reports
min_reports = 3
min_report_stations = 2
tolerance = 0.01
combine_interval_s = 3600         # 0: combine only with `vinyl-mind combine`
min_vote_age_days = 7             # a station's check reports count only after this many days; only the anchors'
                                  # votes decide
review_hours = 48                 # a candidate is neither published nor replaced before this age

[clients]
# Client software and detector versions that may join, contribute and report. Empty lists accept everything, which
# is meant for development. This keeps out versions the hub cannot combine; it does not prove a genuine client.
allowed = []                      # e.g. ["vinyl-check/1.2.*", "vinyl-mind-probe/*"]
detector_versions = []            # e.g. ["1"]

[accounts]
# An account service that hands out invitations to stations that sign in (docs/connect.md). The hub makes no
# connection to it; it names the address to stations and checks the bindings the service signs.
connect_url = ""                  # e.g. "https://accounts.example.org/connect/"; empty: stations join with a code
binding_keys = []                 # public keys of the account service, base64url (32 bytes)
audience = ""                     # this hub's canonical URL, e.g. "https://hub.example.org": a binding that names a
                                  # hub (aud) is accepted only for this one
